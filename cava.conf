# cava config for the background visualizer (AudioSpectrum.qml).
# Raw ASCII frames on stdout: 48 values 0-1000 separated by ';', one frame per line.

[general]
framerate = 60
bars = 48
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 35
